name: Run V2Ray Server Tester

permissions:
  contents: write

on:
  push:
    branches:
      - main

  # Every day at 14:00 Tehran time (10:30 UTC)
  schedule:
    - cron: '30 10 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip libcap2-bin

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: data/requirements.txt

    - name: Configure Python capabilities (safe)
      run: |
        PYTHON_PATH=$(readlink -f $(which python3.11))
        echo "Python path: $PYTHON_PATH"
        sudo setcap 'cap_net_bind_service=+ep' "$PYTHON_PATH" || true

    - name: Install Python dependencies
      run: |
        cd data
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tester
      run: |
        cd data
        python app.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Commit and push results
      uses: EndBug/add-and-commit@v9
      with:
        author_name: "GitHub Actions"
        author_email: "actions@github.com"
        message: "Updated results 🚀"
        add: "."
        push: true
        commit: --allow-empty

name: Run V2Ray Server

permissions:
  contents: write 
  
on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 10 * * *'  
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' 
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libcap2-bin

      - name: Configure Python capabilities (for binding low ports if needed)
        run: |
          PYTHON_PATH=$(which python3)
          echo "Python path: $PYTHON_PATH"
          sudo setcap cap_net_bind_service=+ep $PYTHON_PATH || echo "setcap failed (may not be needed)"

      - name: Install Python dependencies
        run: |
          cd data || { echo "Directory 'data' not found!"; exit 1; }
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tester
        run: |
          cd data
          python ../app.py || python app.py  
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and push results (with timestamp)
        uses: stefanzweifel/git-auto-commit-action@v5 
        with:
          commit_message: |
            Updated V2Ray test results 🚀
            Scheduled run at $(date '+%Y-%m-%d %H:%M:%S UTC')
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions <actions@github.com>"
          file_pattern: "."  

name: Run V2Ray  

permissions:
  contents: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 10 * * *'  
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libcap2-bin

      - name: Configure Python capabilities
        run: |
          PYTHON_PATH=$(which python3)
          echo "Python path: $PYTHON_PATH"
          sudo setcap cap_net_bind_service=+ep $PYTHON_PATH 2>/dev/null || echo "setcap skipped (not needed or failed)"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f "data/requirements.txt" ]; then
            pip install -r data/requirements.txt
          else
            echo "requirements.txt not found in data/"
            exit 1
          fi

      - name: Run tester
        run: python app.py
        env:
          PYTHONUNBUFFERED: 1
        working-directory: '.' 

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            Updated V2Ray test results 🚀
            Run at $(date '+%Y-%m-%d %H:%M:%S UTC')
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          file_pattern: "Servers/ logs/ data/"  
